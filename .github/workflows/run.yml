name: Routine Music Handler
run-name: Routine Music Handler (${{ github.event_name }})

on:
  workflow_dispatch:
  repository_dispatch:
    types: [GoogleAppScript_RoutineMusicHandler]

concurrency:
  group: routine-music-handler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      LOGGING_LEVEL: ${{ vars.LOGGING_LEVEL }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Poetry
        run: |
          pip install poetry

      - name: 🧰 Install dependencies
        run: |
          poetry install
          poetry add git+https://github.com/kaianolevine/kaiano-common-utils.git

      - name: 🏃 Run Routine Music Handler (Source A)
        env:
          ROUTINE_MUSIC_WORKSHEET_NAME: "RoutineSubmissions2026"
          ROUTINE_MUSIC_DEST_ROOT_FOLDER_ID: "1I7NxCM4RLYhXmQ1BaQjsNvKNWgMClgLH"
          ROUTINE_MUSIC_SUBMISSION_SHEET_ID: "1-D-odLxLlkpEpusEdSGzQ3YAlEWMHr4tPtIZ2xEc3sQ"
          ROUTINE_MUSIC_SUBMISSIONS_FOLDER_ID: "1IzWwM-qfXvJsjIL5mtJawROLVWu7Qby7"
        run: poetry run python src/routine_music_handler/main.py

      - name: 🏃 Run Routine Music Handler (Source B)
        env:
          ROUTINE_MUSIC_WORKSHEET_NAME: "Form Responses 1"
          ROUTINE_MUSIC_DEST_ROOT_FOLDER_ID: "1I7NxCM4RLYhXmQ1BaQjsNvKNWgMClgLH"
          ROUTINE_MUSIC_SUBMISSION_SHEET_ID: "1V2hupjlrsCtOTU4p_hALCTRKDaB4We84tLnGUCecLLU"
          ROUTINE_MUSIC_SUBMISSIONS_FOLDER_ID: "1CeUNN08N5SMgZf1RQGHfqPO_ZyrAJzc0M_i2xZCeVuR-TAbnDrncnz9CGJHWY4Af1IecJMi9"
        run: poetry run python src/routine_music_handler/main.py

      - name: 🌐 Checkout website repo
        uses: actions/checkout@v4
        with:
          repository: kaianolevine/kaiano-api
          path: website
          token: ${{ secrets.KAIANO_API_REPO_TOKEN }}

      - name: 📄 Copy JSON snapshot into website repo
        run: |
          mkdir -p website/src/json-site-data/routine-music
          cp -f v1/routine-music/submitted_music.json website/src/json-site-data/routine-music/submitted_music.json

      - name: ✅ Commit and push website repo (if changed)
        run: |
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/json-site-data/routine-music/submitted_music.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update routine music JSON"
          git push